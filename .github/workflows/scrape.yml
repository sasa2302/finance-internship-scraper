name: Daily Internship Scraper

on:
  schedule:
    # Tous les jours a 07:00 UTC (09:00 heure de Paris)
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python main.py

      - name: Upload Excel report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rapport-stages-${{ github.run_id }}
          path: |
            data/stages_finance_marche_*.xlsx
            data/run_log.json
          retention-days: 90
          if-no-files-found: warn

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/internships_*.csv data/off_cycle_*.csv data/summer_*.csv \
                  data/stages_finance_marche_*.xlsx \
                  data/seen_hashes.json data/run_log.json
          git diff --staged --quiet || git commit -m "Scrape $(date -u +'%Y-%m-%d') - rapport off-cycle / summer"
          git push
