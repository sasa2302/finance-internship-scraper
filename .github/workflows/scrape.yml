name: Daily Internship Scraper

on:
  schedule:
    # Tous les jours a 07:00 UTC (09:00 heure de Paris)
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python main.py

      - name: Upload Excel report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rapport-stages-${{ github.run_id }}
          path: |
            data/stages_finance_marche.xlsx
            data/run_log.json
          retention-days: 90
          if-no-files-found: warn

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Le depot a pu bouger pendant le run (un commit pousse a la main,
          # ou un autre run). Un simple `git push` echoue alors en
          # non-fast-forward et fait tomber tout le job, alors meme que le
          # scraping a reussi. On se recale donc sur l'etat distant avant de
          # commiter : `reset --soft` deplace HEAD sans toucher aux fichiers
          # qu'on vient de generer, qui restent donc prioritaires.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --soft FETCH_HEAD
            git add data/stages_finance_marche.xlsx \
                    data/seen_hashes.json data/run_log.json
            if git diff --staged --quiet; then
              echo "Aucun changement a commiter."
              exit 0
            fi
            git commit -m "Scrape $(date -u +'%Y-%m-%d') - rapport off-cycle / summer"
            if git push origin main; then
              echo "Pousse (tentative $attempt)."
              exit 0
            fi
            echo "Push refuse, le depot a bouge. Nouvelle tentative..."
            sleep 5
          done
          echo "Push impossible apres 3 tentatives."
          exit 1
